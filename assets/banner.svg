    <path d="M76 42L42 62V104C42 132 58 154 76 164" stroke="#94A3B8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M116 42L150 62V104C150 132 134 154 116 164" stroke="#94A3B8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M96 30V162" stroke="#38BDF8" stroke-width="9" stroke-linecap="round"/>
    <circle cx="96" cy="96" r="15" fill="#F8FAFC" stroke="#38BDF8" stroke-width="6"/>
