<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="glow" cx="220" cy="160" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Outer card frame -->
  <rect x="4" y="4" width="1192" height="312" rx="24" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="4" y="4" width="1192" height="312" rx="24" fill="url(#glow)"/>

  <!-- Subtle engineering grid lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.55">
    <path d="M40 80H1160M40 160H1160M40 240H1160"/>
    <path d="M360 28V292M640 28V292M920 28V292"/>
  </g>

  <!-- Split-armor calibration emblem -->
