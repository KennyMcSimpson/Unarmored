  <rect x="698" y="76" width="84" height="34" rx="17" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="740" y="99" text-anchor="middle" fill="#7DD3FC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">v0.6.0</text>

  <text x="338" y="156" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" font-weight="500">
    Cross-family register de-armoring &amp; grounded peer voice for Coding Agents
  </text>

  <!-- Host support pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <rect x="338" y="182" width="132" height="32" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="404" y="203" text-anchor="middle" fill="#E2E8F0">Claude Code</text>

    <rect x="482" y="182" width="118" height="32" rx="10" fill="#1E293B" stroke="#334155"/>
